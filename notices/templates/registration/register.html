{% extends "notices/base.html" %}
{% block title %}Sign Up — CommuNotice{% endblock %}
{% block content %}
<div class="form-card">
    <div class="auth-icon">
        <svg width="26" height="26"
            style="width:26px; height:26px; min-width:26px; max-width:26px; min-height:26px; max-height:26px; flex-shrink:0;"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M19 8v6M22 11h-6" />
        </svg>
    </div>
    <h1 class="form-title">Join Our Community</h1>
    <p class="form-subtitle">Create a free account to post notices and stay connected.</p>
    <form method="post" class="auth-form" id="registerForm">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-block">Sign Up</button>
    </form>
    <p class="form-foot">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const pwd1 = document.getElementById('id_password1');
        const pwd2 = document.getElementById('id_password2');
        const usernameInput = document.getElementById('id_username');
        if (!pwd1) return;

        // Completely remove default static Django helptext list elements
        const formCard = pwd1.closest('.form-card') || document;
        const staticHelps = formCard.querySelectorAll('.helptext, ul:not(.pwd-checklist)');
        staticHelps.forEach(el => el.remove());

        // Create Dynamic Password Strength & Checklist Box
        const checklistContainer = document.createElement('div');
        checklistContainer.className = 'pwd-strength-container';
        checklistContainer.innerHTML = `
            <div class="pwd-strength-header">
                <span>Password strength</span>
                <span id="pwdStrengthLabel" style="color:var(--muted);">Too short</span>
            </div>
            <div class="pwd-strength-bar">
                <div class="pwd-strength-fill" id="pwdStrengthFill"></div>
            </div>
            <ul class="pwd-checklist" id="pwdChecklist" style="margin-top: 10px;">
                <li class="pwd-rule" id="ruleMinLength" style="display:none; color:#ef4444;">
                    <span class="pwd-rule-icon" style="color:#ef4444; border-color:#fca5a5;">&bull;</span>
                    <span>Your password must contain at least 8 characters.</span>
                </li>
                <li class="pwd-rule" id="ruleNotNumeric" style="display:none; color:#ef4444;">
                    <span class="pwd-rule-icon" style="color:#ef4444; border-color:#fca5a5;">&bull;</span>
                    <span>Your password can't be entirely numeric.</span>
                </li>
                <li class="pwd-rule" id="ruleNotSimilar" style="display:none; color:#ef4444;">
                    <span class="pwd-rule-icon" style="color:#ef4444; border-color:#fca5a5;">&bull;</span>
                    <span>Your password can't be too similar to your username.</span>
                </li>
            </ul>
        `;

        const pwd1Parent = pwd1.closest('.password-input-wrapper') || pwd1;
        pwd1Parent.parentNode.insertBefore(checklistContainer, pwd1Parent.nextSibling);

        function updateChecklist() {
            // Re-clean any static helptext elements if Django re-rendered them
            const parentP = pwd1.closest('p') || pwd1.parentNode;
            if (parentP) {
                const staticHelp = parentP.querySelectorAll('.helptext, ul:not(.pwd-checklist)');
                staticHelp.forEach(el => el.remove());
            }

            const val = pwd1.value;
            const confirmVal = pwd2 ? pwd2.value : '';
            const unameVal = usernameInput ? usernameInput.value.trim().toLowerCase() : '';

            if (val.length === 0) {
                setRuleVisible('ruleMinLength', false);
                setRuleVisible('ruleNotNumeric', false);
                setRuleVisible('ruleNotSimilar', false);

                const fill = document.getElementById('pwdStrengthFill');
                const label = document.getElementById('pwdStrengthLabel');
                if (fill && label) {
                    fill.style.width = '0%';
                    label.textContent = 'Too short';
                    label.style.color = 'var(--muted)';
                }
                return;
            }

            // Rule 1: Min 8 chars
            const isMinLength = val.length >= 8;
            setRuleVisible('ruleMinLength', !isMinLength);

            // Rule 2: Not entirely numeric
            const isNotNumeric = !/^\d+$/.test(val);
            setRuleVisible('ruleNotNumeric', !isNotNumeric);

            // Rule 3: Not similar to username
            const isNotSimilar = unameVal === '' || !val.toLowerCase().includes(unameVal);
            setRuleVisible('ruleNotSimilar', !isNotSimilar);

            // Calculate strength score
            let score = 0;
            if (isMinLength) score += 35;
            if (val.length >= 12) score += 15;
            if (isNotNumeric) score += 25;
            if (isNotSimilar) score += 15;
            if (/[\W]/.test(val)) score += 10;

            score = Math.min(100, score);

            const fill = document.getElementById('pwdStrengthFill');
            const label = document.getElementById('pwdStrengthLabel');

            if (fill && label) {
                fill.style.width = score + '%';
                if (score < 40) {
                    fill.style.backgroundColor = '#ef4444';
                    label.textContent = 'Weak';
                    label.style.color = '#ef4444';
                } else if (score < 80) {
                    fill.style.backgroundColor = '#f59e0b';
                    label.textContent = 'Medium';
                    label.style.color = '#f59e0b';
                } else {
                    fill.style.backgroundColor = '#22c55e';
                    label.textContent = 'Strong ✓';
                    label.style.color = '#22c55e';
                }
            }
        }

        function setRuleVisible(id, show) {
            const el = document.getElementById(id);
            if (!el) return;
            el.style.display = show ? 'flex' : 'none';
        }

        pwd1.addEventListener('input', updateChecklist);
        if (pwd2) pwd2.addEventListener('input', updateChecklist);
        if (usernameInput) usernameInput.addEventListener('input', updateChecklist);

        // ---------- Dynamic Real-time Field Errors for ALL Sections ----------
        const fieldsToValidate = [
            { id: 'id_username', name: 'Username', validate: val => val.trim().length > 0 ? null : '✕ Username is required.' },
            { id: 'id_first_name', name: 'First name', validate: val => val.trim().length > 0 ? null : '✕ First name is required.' },
            { id: 'id_email', name: 'Email address', validate: val => {
                if (val.trim().length === 0) return '✕ Email address is required.';
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(val.trim())) return '✕ Please enter a valid email address (e.g. name@example.com).';
                return null;
            }},
            { id: 'id_password1', name: 'Password', validate: val => val.length > 0 ? null : '✕ Password is required.' },
            { id: 'id_password2', name: 'Password confirmation', validate: val => {
                if (val.length === 0) return '✕ Please confirm your password.';
                if (pwd1 && val !== pwd1.value) return '✕ Passwords do not match.';
                return null;
            }}
        ];

        fieldsToValidate.forEach(item => {
            const input = document.getElementById(item.id);
            if (!input) return;

            input.setAttribute('required', 'required');

            let errEl = input.parentNode.querySelector('.field-dynamic-error');
            if (!errEl) {
                errEl = document.createElement('div');
                errEl.className = 'field-dynamic-error';
                errEl.style.cssText = 'color:#ef4444; font-size:0.82rem; font-weight:600; margin-top:5px; display:none; align-items:center; gap:5px; transition:all 0.15s ease;';
                const targetParent = input.closest('.password-input-wrapper') || input;
                targetParent.parentNode.insertBefore(errEl, targetParent.nextSibling);
            }

            function validateField(showIfEmpty = false) {
                const val = input.value;
                if (!showIfEmpty && val.trim().length === 0 && !input.dataset.touched) {
                    errEl.style.display = 'none';
                    input.style.borderColor = '';
                    return true;
                }
                input.dataset.touched = 'true';
                const errMsg = item.validate(val);
                if (errMsg) {
                    errEl.textContent = errMsg;
                    errEl.style.display = 'flex';
                    errEl.style.color = '#ef4444';
                    input.style.borderColor = '#ef4444';
                    return false;
                } else {
                    if (item.id === 'id_password2' && pwd1 && val === pwd1.value && val.length > 0) {
                        errEl.textContent = '✓ Passwords match';
                        errEl.style.color = '#22c55e';
                        errEl.style.display = 'flex';
                    } else {
                        errEl.style.display = 'none';
                    }
                    input.style.borderColor = '#22c55e';
                    return true;
                }
            }

            input.addEventListener('input', () => validateField(false));
            input.addEventListener('blur', () => validateField(true));

            input.checkDynamicValid = () => validateField(true);
        });

        // Form Submit Handler: Validate all sections before submission
        const registerForm = document.getElementById('registerForm');
        if (registerForm) {
            registerForm.addEventListener('submit', function(e) {
                let allValid = true;
                let firstInvalidInput = null;

                fieldsToValidate.forEach(item => {
                    const input = document.getElementById(item.id);
                    if (input && input.checkDynamicValid) {
                        const isValid = input.checkDynamicValid();
                        if (!isValid) {
                            allValid = false;
                            if (!firstInvalidInput) firstInvalidInput = input;
                        }
                    }
                });

                if (!allValid) {
                    e.preventDefault();
                    if (firstInvalidInput) firstInvalidInput.focus();
                }
            });
        }
    });
</script>
{% endblock %}
